<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Trò chơi đổi nút!</title>
  <link rel="stylesheet" href="20_10.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <!-- Cảnh 1 -->
  <section id="scene1" class="scene active">
    <h2>🎯 Nhập tên của bạn</h2>
    <input type="text" id="playerName" placeholder="Nhập tên..."><br><br>

    <label>Giới tính:</label>
    <select id="gender">
      <option value="">-- Chọn giới tính --</option>
      <option value="male">Nam</option>
      <option value="female">Nữ</option>
    </select><br><br>

    <button id="startBtn">Bắt đầu</button>
    <p id="kickMessage" class="hidden" style="color:red; font-weight:bold;"></p>
  </section>

  <!-- Cảnh 2 -->
  <section id="scene2" class="scene">
    <h2>🔥 Trò chơi đổi nút! 🔥</h2>
    <p>Bấm nhanh các nút xuất hiện ngẫu nhiên!</p>
    <div id="gameArea"></div>
    <p id="progress"></p>
  </section>

  <!-- Cảnh 3 -->
  <section id="scene3" class="scene">
    <h2>🎉 Chúc mừng! 🎉</h2>
    <pre id="poem" style="text-align: center; font-family: times new roman; font-size: 16px;"></pre>
    <p id="finalMessage"></p>
    <button id="restartBtn">Vững bước bình an, vạn sự như ý 🤗</button>
  </section>

  <script src="20_10.js"></script>
</body>
</html>
